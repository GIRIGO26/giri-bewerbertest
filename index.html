<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GIRI Bewerbertest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #012756; --blue: #004EAD; --blue-l: #A3C8F5; --blue-xl: #F0F7FF;
    --mint: #03D39B; --mint-d: #06513D; --mint-xl: #F1FDFA;
    --ink: #000; --g800: #262626; --g600: #525252; --g500: #737373; --g400: #A3A3A3; --line: #E5E7EB;
    --err: #DC2626; --bg: #fff; --card: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--g800); font-family: Montserrat, system-ui, sans-serif; }
  body { -webkit-user-select: none; user-select: none; }
  textarea, input { -webkit-user-select: text; user-select: text; }
  header { background: var(--navy); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: .5px; }
  .logo span { color: var(--mint); }
  .logo .lt { color: #fff; }
  #section { white-space: nowrap; }
  h2.open { font-size: 17px; font-weight: 600; }
  .hdr-right { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 8px; min-width: 70px; text-align: center; }
  .timer.warn { background: var(--err); }
  .progress { height: 4px; background: var(--blue-xl); }
  .progress > div { height: 4px; background: var(--mint); width: 0; transition: width .25s; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { color: var(--navy); font-size: 26px; margin: 0 0 8px; }
  h2 { color: var(--navy); font-size: 21px; margin: 0 0 14px; line-height: 1.35; }
  p, li { line-height: 1.55; font-size: 15px; }
  .muted { color: var(--g500); font-size: 13px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 22px; background: var(--card); }
  .stack > * + * { margin-top: 14px; }
  label.f { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: var(--g800); }
  input[type=text], input[type=email], input[type=password], textarea {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 15px; border: 1.5px solid var(--line); border-radius: 10px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--blue); }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .btn { appearance: none; border: 0; background: var(--blue); color: #fff; font: inherit; font-weight: 600; font-size: 16px; padding: 14px 22px; border-radius: 10px; cursor: pointer; }
  .btn:disabled { background: var(--g400); cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--g600); border: 1.5px solid var(--line); }
  .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-top: 22px; }
  .opt { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 14px 16px; font: inherit; font-size: 15px; color: var(--g800); cursor: pointer; margin-top: 10px; line-height: 1.45; }
  .opt:hover { border-color: var(--blue-l); }
  .opt.sel { border-color: var(--blue); background: var(--blue-xl); font-weight: 600; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; cursor: pointer; }
  .check input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
  .err { color: var(--err); font-size: 14px; margin-top: 8px; min-height: 18px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-xl); padding: 4px 10px; border-radius: 99px; margin-bottom: 12px; }
  .parts { display: grid; gap: 10px; margin: 16px 0; }
  .part { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .part b { color: var(--navy); }
  .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  /* DISC */
  .disc-grid { display: grid; grid-template-columns: 1fr 84px 84px; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .disc-grid > div { padding: 12px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .disc-grid .h { background: var(--blue-xl); font-size: 11px; padding: 10px 4px !important; hyphens: none; font-weight: 600; color: var(--navy); justify-content: center; text-align: center; line-height: 1.25; }
  .disc-grid .h:first-child { justify-content: flex-start; }
  .disc-grid .w { font-size: 16px; font-weight: 500; }
  .disc-grid .c { justify-content: center; }
  .disc-grid > div:nth-last-child(-n+3) { border-bottom: 0; }
  .radio { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--g400); background: #fff; cursor: pointer; padding: 0; }
  .radio.most.on { background: var(--mint); border-color: var(--mint-d); }
  .radio.least.on { background: var(--g600); border-color: var(--g800); }
  /* Tools */
  .tool { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; font: inherit; font-size: 12px; padding: 8px 9px; cursor: pointer; color: var(--g600); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--blue); color: #fff; font-weight: 600; }
  .watch { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 4; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; background: var(--blue-xl); color: var(--navy); font-size: 13px; font-weight: 500; padding: 8px 16px; border-bottom: 1px solid var(--blue-l); }
  .watch.alert { background: #FEF2F2; color: #991B1B; border-bottom-color: #FCA5A5; }
  .leaves { font-weight: 700; white-space: nowrap; }
  .done { text-align: center; padding: 40px 10px; }
  .done .big { font-size: 56px; color: var(--mint); }
  .warnbox { background: #FFF7ED; border: 1px solid #FDBA74; color: #7C2D12; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  @media (max-width: 480px) {
    .logo .lt { display: none; }
    .disc-grid { grid-template-columns: 1fr 78px 78px; }
    .seg button { padding: 8px 6px; font-size: 11px; }
    h2 { font-size: 19px; }
  }
</style>
</head>

</header>
<div class="progress"><div id="bar"></div></div>

</div>
<main id="app"></main>

// Nur in der Vorschau: Fragen im Klartext, kein Versand.
const DEMO_BANK = /*DEMO_BANK*/null;

// ---------- Zustand ----------
const S = {
  code: "", name: "", email: "", bank: null,
  data: { tools: {}, disc: {}, cog: {}, contentMc: {}, contentOpen: {}, meta: { blurCount: 0, blurMs: 0, pasteAttempts: 0, sectionMs: {}, timedOut: {} } },
  running: false, blurAt: null, t0: null, secT0: null,
};
const $app = document.getElementById("app");
const $bar = document.getElementById("bar");
const $timer = document.getElementById("timer");
const $section = document.getElementById("section");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const progress = (p) => { $bar.style.width = Math.round(p * 100) + "%"; };

// ---------- Anti-Schummel ----------
const $watch = document.getElementById("watch");
const $leaves = document.getElementById("leaves");
function updateLeave(showToast) {
  const n = S.data.meta.blurCount;
  $leaves.hidden = n === 0;
  $leaves.textContent = `Testfenster ${n}× verlassen`;
  $watch.classList.toggle("alert", n > 0);
  if (showToast && n > 0) toast(`Testfenster verlassen – registriert (${n}×)`);
}
document.addEventListener("visibilitychange", () => {
  if (!S.running) return;
  if (document.hidden) { S.blurAt = Date.now(); S.data.meta.blurCount++; updateLeave(false); }
  else if (S.blurAt) { S.data.meta.blurMs += Date.now() - S.blurAt; S.blurAt = null; updateLeave(true); }
});
window.addEventListener("blur", () => { if (S.running && !document.hidden && !S.blurAt) { S.blurAt = Date.now(); S.data.meta.blurCount++; updateLeave(false); } });
window.addEventListener("focus", () => { if (S.running && S.blurAt && !document.hidden) { S.data.meta.blurMs += Date.now() - S.blurAt; S.blurAt = null; updateLeave(true); } });
document.addEventListener("paste", (e) => { if (S.running) { e.preventDefault(); S.data.meta.pasteAttempts++; toast("Einfügen ist im Test deaktiviert."); } });
document.addEventListener("copy", (e) => { if (S.running) e.preventDefault(); });
document.addEventListener("contextmenu", (e) => { if (S.running) e.preventDefault(); });
window.addEventListener("beforeunload", (e) => { if (S.running) { e.preventDefault(); e.returnValue = ""; } });

function toast(msg) {
  const t = document.createElement("div");
  t.textContent = msg;
  Object.assign(t.style, { position: "fixed", left: "50%", bottom: "24px", transform: "translateX(-50%)", background: "#262626", color: "#fff", padding: "10px 16px", borderRadius: "10px", fontSize: "14px", zIndex: 50 });
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

// ---------- Timer ----------
let tick = null;
function startTimer(seconds, onEnd) {
  clearInterval(tick);
  const end = Date.now() + seconds * 1000;
  $timer.hidden = false;
  const draw = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    $timer.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    $timer.classList.toggle("warn", left <= 60);
    if (left <= 0) { clearInterval(tick); $timer.hidden = true; onEnd(); }
  };
  draw(); tick = setInterval(draw, 500);
}
function stopTimer() { clearInterval(tick); $timer.hidden = true; }
function sectionStart(key) { S.secT0 = Date.now(); S.curSec = key; }
function sectionEnd() { if (S.curSec) S.data.meta.sectionMs[S.curSec] = Date.now() - S.secT0; S.curSec = null; }

// ---------- API ----------
const b64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
async function unlockBank(code) {
  if (DEMO_BANK) return DEMO_BANK;
  const pw = new TextEncoder().encode(code.trim().toLowerCase());
  const base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(ENC_BANK.salt), iterations: ENC_BANK.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC_BANK.iv) }, key, b64(ENC_BANK.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function submit() {
  if (DEMO_BANK) { await new Promise((r) => setTimeout(r, 400)); return { ok: true, demo: true }; }
  // Formular-Body ohne eigene Header: kein CORS-Preflight nötig
  const body = new URLSearchParams({ action: "submit", code: S.code, name: S.name, email: S.email, payload: JSON.stringify(S.data) });
  const r = await fetch(CONFIG.WEBHOOK_URL, { method: "POST", body });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || "Fehler");
  return j;
}

// ---------- Screens ----------
function welcome() {
  $section.textContent = ""; progress(0);
  $app.innerHTML = `
  <div class="stack">
    <h1>Willkommen!</h1>
    <p>Schön, dass du da bist. Dieser Test dauert etwa <b>30 Minuten</b> und hat drei Teile:</p>
    <div class="parts">
      <div class="part"><div class="num">1</div><div><b>Arbeitsstil</b> · ca. 6 Min.<br><span class="muted">Wie du dich selbst siehst. Es gibt kein richtig oder falsch.</span></div></div>
      <div class="part"><div class="num">2</div><div><b>Denkaufgaben</b> · 15 Min.<br><span class="muted">Zahlen, Sprache, Logik. Die Zeit läuft sichtbar mit.</span></div></div>
      <div class="part"><div class="num">3</div><div><b>Content &amp; Video</b> · 10 Min.<br><span class="muted">Fragen und kurze Aufgaben aus dem Job.</span></div></div>
    </div>
    <div class="warnbox">Bitte leg dein Handy weg und bleib in diesem Fenster. <b>Jedes Verlassen des Testfensters wird registriert und mitgeschickt.</b> Hilfsmittel wie Suche oder ChatGPT sind nicht erlaubt. Einmal beantwortete Fragen kannst du nicht mehr ändern.</div>
    <div class="card stack">
      <div><label class="f" for="name">Dein Name</label><input id="name" type="text" autocomplete="off" maxlength="120"></div>
      <div><label class="f" for="email">E-Mail <span class="muted">(optional)</span></label><input id="email" type="email" autocomplete="off" maxlength="200"></div>
      <div><label class="f" for="code">Test-Code <span class="muted">(bekommst du von uns)</span></label><input id="code" type="password" autocomplete="off"></div>
      <label class="check"><input id="consent" type="checkbox"><span>Ich bin einverstanden, dass die AR-Experts GmbH meine Antworten zur Auswahl im Bewerbungsverfahren auswertet und speichert. Die Daten werden nach spätestens 6 Monaten gelöscht. Die Teilnahme ist freiwillig.</span></label>
      <div class="err" id="err"></div>
      <button class="btn" id="go">Test starten</button>
    </div>
  </div>`;
  const go = document.getElementById("go");
  go.onclick = async () => {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const code = document.getElementById("code").value.trim();
    const consent = document.getElementById("consent").checked;
    const err = document.getElementById("err");
    if (!name) return (err.textContent = "Bitte gib deinen Namen ein.");
    if (!code && !DEMO_BANK) return (err.textContent = "Bitte gib den Test-Code ein.");
    if (!consent) return (err.textContent = "Bitte bestätige die Einwilligung.");
    go.disabled = true; err.textContent = "";
    try {
      S.bank = await unlockBank(code);
      S.code = code; S.name = name; S.email = email;
      S.data.meta.startedAt = new Date().toISOString();
      S.data.meta.userAgent = navigator.userAgent;
      S.t0 = Date.now(); S.running = true;
      $watch.hidden = false; updateLeave(false);
      tools();
    } catch (e) {
      err.textContent = "Der Code stimmt nicht.";
      go.disabled = false;
    }
  };
}

function tools() {
  $section.textContent = "Vorab"; progress(0.02);
  const levels = ["nie", "Grundl.", "sicher", "Profi"];
  $app.innerHTML = `
  <span class="pill">Vorab · 1 Minute</span>
  <h2>Wie gut kennst du diese Tools?</h2>
  <div id="tl"></div>
  <div class="row"><span></span><button class="btn" id="next">Weiter zu Teil 1</button></div>`;
  const tl = document.getElementById("tl");
  S.bank.tools.forEach((t) => {
    S.data.tools[t] = 0;
    const row = document.createElement("div");
    row.className = "tool";
    row.innerHTML = `<div>${esc(t)}</div><div class="seg">${levels.map((l, i) => `<button data-v="${i}" class="${i === 0 ? "on" : ""}">${l}</button>`).join("")}</div>`;
    row.querySelectorAll("button").forEach((b) => b.onclick = () => {
      row.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on"); S.data.tools[t] = +b.dataset.v;
    });
    tl.appendChild(row);
  });
  document.getElementById("next").onclick = discIntro;
}

// ---------- Teil 1: DISC ----------
function discIntro() {
  $section.textContent = "Teil 1 von 3";
  $app.innerHTML = `
  <span class="pill">Teil 1 · Arbeitsstil</span>
  <h2>So funktioniert's</h2>
  <p>Du siehst 24 Mal vier Eigenschaften. Pro Runde tippst du zwei Mal:</p>
  <ul><li>zuerst auf das Wort, das <b>am meisten</b> zu dir passt,</li><li>dann auf das Wort, das <b>am wenigsten</b> zu dir passt.</li></ul>
  <p>Oft passen mehrere oder keins so richtig. Das ist gewollt – nimm einfach das, was am ehesten stimmt.</p>
  <p>Denk an dich bei der Arbeit. Nicht lange überlegen, der erste Impuls ist meistens der richtige. Es gibt kein richtig oder falsch.</p>
  <div class="row"><span class="muted">Ohne Zeitlimit, ca. 6 Minuten</span><button class="btn" id="go">Los geht's</button></div>`;
  document.getElementById("go").onclick = () => { sectionStart("disc"); discItem(0); };
}

function discItem(i) {
  const blocks = S.bank.disc;
  if (i >= blocks.length) { sectionEnd(); return cogIntro(); }
  const b = blocks[i];
  const order = shuffle([0, 1, 2, 3]);
  const sel = { most: null, least: null };
  const draw = () => {
    progress(0.04 + 0.3 * ((i + (sel.most === null ? 0 : 0.5)) / blocks.length));
    const step = sel.most === null ? "most" : "least";
    $app.innerHTML = `
    <span class="pill">Teil 1 · ${i + 1} von ${blocks.length}</span>
    <h2>${step === "most"
      ? `Welches Wort passt <u>am meisten</u> zu dir?`
      : `Und welches passt <u>am wenigsten</u> zu dir?`}</h2>
    <p class="muted" style="margin-top:-6px">${step === "most" ? "Schritt 1 von 2 · denk an dich bei der Arbeit" : "Schritt 2 von 2"}</p>
    <div id="opts">${order.map((k) => {
      if (k === sel.most) return `<button class="opt sel" disabled style="opacity:.7">✓ ${esc(b.words[k])} <span class="muted">· am meisten</span></button>`;
      return `<button class="opt" data-k="${k}">${esc(b.words[k])}</button>`;
    }).join("")}</div>
    <div class="row">${step === "least" ? `<button class="btn ghost" id="back">Zurück</button>` : "<span></span>"}<span class="muted">Tippen genügt</span></div>`;
    document.querySelectorAll(".opt[data-k]").forEach((el) => el.onclick = () => {
      const k = +el.dataset.k;
      if (step === "most") { sel.most = k; draw(); }
      else { sel.least = k; S.data.disc[b.id] = { ...sel }; discItem(i + 1); }
    });
    const back = document.getElementById("back");
    if (back) back.onclick = () => { sel.most = null; draw(); };
  };
  draw();
}

// ---------- Teil 2: Denkaufgaben ----------
function cogIntro() {
  $section.textContent = "Teil 2 von 3"; progress(0.35);
  $app.innerHTML = `
  <span class="pill">Teil 2 · Denkaufgaben</span>
  <h2>20 Aufgaben in 15 Minuten</h2>
  <ul>
    <li>Zahlenreihen, Sprache, Logik und etwas Rechnen.</li>
    <li>Kopfrechnen reicht. Kein Taschenrechner, kein Handy.</li>
    <li>Du kannst eine Aufgabe überspringen, aber nicht zurückgehen.</li>
    <li>Nicht jeder schafft alles. Wenn du hängst: lieber raten oder weiter.</li>
    <li>Wenn die Zeit abläuft, geht es automatisch mit Teil 3 weiter.</li>
  </ul>
  <div class="row"><span class="muted">Die Zeit startet mit dem Klick.</span><button class="btn" id="go">Zeit starten</button></div>`;
  document.getElementById("go").onclick = () => {
    sectionStart("cog");
    S.cogDone = false;
    startTimer(CONFIG.COG_SECONDS, () => { if (!S.cogDone) { S.data.meta.timedOut.cog = true; finishCog(); } });
    mcItem(S.bank.cog, 0, "cog", "Teil 2", 0.35, 0.35, finishCog);
  };
}
function finishCog() { if (S.cogDone) return; S.cogDone = true; stopTimer(); sectionEnd(); contentIntro(); }

function mcItem(items, i, key, label, p0, pw, onDone) {
  if (i >= items.length) return onDone();
  progress(p0 + pw * (i / items.length));
  const it = items[i];
  const shown = Date.now();
  let pick = null;
  $app.innerHTML = `
  <span class="pill">${label} · ${i + 1} von ${items.length}</span>
  <h2>${esc(it.q)}</h2>
  <div id="opts">${it.options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
  <div class="row"><button class="btn ghost" id="skip">Überspringen</button><button class="btn" id="next" disabled>Weiter</button></div>`;
  const next = document.getElementById("next");
  document.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
    document.querySelectorAll(".opt").forEach((x) => x.classList.remove("sel"));
    b.classList.add("sel"); pick = +b.dataset.k; next.disabled = false;
  });
  const save = (a) => { S.data[key][it.id] = { a, ms: Date.now() - shown }; mcItem(items, i + 1, key, label, p0, pw, onDone); };
  next.onclick = () => save(pick);
  document.getElementById("skip").onclick = () => save(null);
}

// ---------- Teil 3: Content & Video ----------
function contentIntro() {
  $section.textContent = "Teil 3 von 3"; progress(0.7);
  $app.innerHTML = `
  <span class="pill">Teil 3 · Content &amp; Video</span>
  <h2>${S.bank.contentMc.length} kurze Fragen und ${S.bank.contentOpen.length} kleine Aufgaben · 10 Minuten</h2>
  <ul>
    <li>Erst Auswahlfragen, dann drei Aufgaben mit eigenem Text.</li>
    <li>Bei den Aufgaben zählen deine Ideen, nicht schöne Sätze. Stichpunkte sind völlig okay.</li>
    <li>Plan für die Textaufgaben mindestens 6 Minuten ein.</li>
  </ul>
  <div class="row"><span class="muted">Die Zeit startet mit dem Klick.</span><button class="btn" id="go">Zeit starten</button></div>`;
  document.getElementById("go").onclick = () => {
    sectionStart("content");
    S.contentDone = false;
    startTimer(CONFIG.CONTENT_SECONDS, () => { if (!S.contentDone) { S.data.meta.timedOut.content = true; saveOpen(); finishAll(); } });
    mcItem(S.bank.contentMc, 0, "contentMc", "Teil 3", 0.7, 0.15, () => openItem(0));
  };
}

let curOpen = null;
function saveOpen() { if (curOpen) S.data.contentOpen[curOpen.id] = curOpen.el.value.slice(0, 4000); }
function openItem(i) {
  const items = S.bank.contentOpen;
  if (i >= items.length) return finishAll();
  progress(0.85 + 0.13 * (i / items.length));
  const it = items[i];
  $app.innerHTML = `
  <span class="pill">Teil 3 · Aufgabe ${i + 1} von ${items.length}</span>
  <h2 class="open">${esc(it.q)}</h2>
  <textarea id="t" placeholder="${esc(it.hint)}" spellcheck="false"></textarea>
  <div class="row"><span class="muted">${esc(it.hint)}</span><button class="btn" id="next">${i + 1 === items.length ? "Test abschließen" : "Weiter"}</button></div>`;
  const el = document.getElementById("t");
  curOpen = { id: it.id, el };
  el.focus();
  document.getElementById("next").onclick = () => { saveOpen(); curOpen = null; openItem(i + 1); };
}

async function finishAll() {
  if (S.contentDone) return; S.contentDone = true;
  stopTimer(); sectionEnd(); S.running = false; curOpen = null; $watch.hidden = true;
  S.data.meta.finishedAt = new Date().toLocaleString("de-DE", { timeZone: "Europe/Berlin" });
  S.data.meta.sectionMs.total = Date.now() - S.t0;
  $section.textContent = ""; progress(1);
  $app.innerHTML = `<div class="done"><p>Wird gespeichert …</p></div>`;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      await submit();
      $app.innerHTML = `<div class="done"><div class="big">✓</div><h1>Geschafft, danke!</h1><p>Deine Antworten sind angekommen.<br>Gib uns kurz Bescheid, dass du fertig bist.</p></div>`;
      return;
    } catch (e) { await new Promise((r) => setTimeout(r, 1500)); }
  }
  $app.innerHTML = `<div class="done"><h1>Speichern hat nicht geklappt</h1><p>Bitte schließ das Fenster nicht und gib uns Bescheid.</p><button class="btn" id="retry">Nochmal versuchen</button></div>`;
  document.getElementById("retry").onclick = () => { S.contentDone = false; S.running = true; finishAll(); };
}

welcome();
</script>
